version: 1.0
profile:
  path: .qodana/asciidoc-inspection.xml
linter: jetbrains/qodana-jvm-community:2024.3
plugins:
  - id: org.asciidoctor.intellij.asciidoc
  - id: com.intellij.grazie
  - id: tanvd.grazi

exclude:
  - name: All
    paths:
      - .github
      - schemas
      - CONTRIBUTING.md
      - LICENSE.txt
      - README.md