name: Qodana Code Quality Report

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  actions: read

jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Qodana
        uses: JetBrains/qodana-action@v2024.3.4
        with:
          upload-result: true
          args: >
            --linter,jetbrains/qodana-jvm-community:2024.3,
            -v,${{ github.workspace }}/asciidoctor-intellij-plugin:/data/cache/plugins/asciidoctor-intellij-plugin,
            -v,${{ github.workspace }}/grazi-plugin:/data/cache/plugins/grazi-plugin,
            --baseline,doc/qodana-baseline.sarif.json

      # https://docs.github.com/en/code-security/code-scanning/integrating-with-code-scanning/uploading-a-sarif-file-to-github#example-workflow-that-runs-the-eslint-analysis-tool
      - name: Upload SARIF report to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
