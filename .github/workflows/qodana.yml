name: Qodana AsciiDoc Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pages: write
  actions: read

jobs:
  qodana-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get changed AsciiDoc files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: "*"

      - name: Run Qodana (if AsciiDoc files changed)
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: JetBrains/qodana-action@v2023.3
        with:
          linter: jetbrains/qodana-jvm-community  # Free version
          args: --save-report --include ${{ steps.changed-files.outputs.all_changed_files }}

      - name: Upload Qodana Report as Artifact
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qodana-report
          path: qodana/report

  deploy-report:
    needs: qodana-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Download Qodana Report
        uses: actions/download-artifact@v4
        with:
          name: qodana-report
          path: qodana-report

      - name: Move Report to PR Directory
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          mkdir -p reports/pr-$PR_NUMBER
          mv qodana-report/* reports/pr-$PR_NUMBER/

      - name: Commit and Push Report
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add reports/
          git commit -m "Update Qodana report for PR #${{ github.event.pull_request.number }}" || exit 0
          git push origin gh-pages
